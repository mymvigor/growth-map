<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Growth Map Mobile QA</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    :root {
      --background-primary:#fbfbfa; --background-primary-alt:#f7f7f5; --background-secondary:#f3f3f0;
      --background-modifier-border:#deded9; --interactive-accent:#477a62; --text-normal:#20211f;
      --text-muted:#72756f; --text-on-accent:#fff; --text-error:#b34b45;
    }
    html,body,.growth-map-view { width:100%; height:100%; margin:0; font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    button,input { font:inherit; }
  </style>
</head>
<body>
  <main class="growth-map-view">
    <div class="gm-shell">
      <div class="gm-scroll">
        <header class="gm-page-header">
          <div class="gm-header-leading"><div><p class="gm-eyebrow">MY GROWTH</p><h1>Your Growth Map</h1></div></div>
          <button class="gm-icon-button" aria-label="Open archive">▣</button>
        </header>
        <section class="gm-overview"><div><span class="gm-muted">Overall</span></div><strong>38%</strong><div class="gm-progress-track"><div class="gm-progress-fill" style="width:38%"></div></div></section>
        <section class="gm-area-grid">
          <button class="gm-area-card"><div class="gm-card-top"><span>Work</span><strong>48%</strong></div><div class="gm-progress-track"><div class="gm-progress-fill" style="width:48%"></div></div></button>
          <button class="gm-area-card"><div class="gm-card-top"><span>Fitness</span><strong>35%</strong></div><div class="gm-progress-track"><div class="gm-progress-fill" style="width:35%"></div></div></button>
          <button class="gm-area-card"><div class="gm-card-top"><span>English</span><strong>28%</strong></div><div class="gm-progress-track"><div class="gm-progress-fill" style="width:28%"></div></div></button>
          <button class="gm-area-card"><div class="gm-card-top"><span>Communication</span><strong>20%</strong></div><div class="gm-progress-track"><div class="gm-progress-fill" style="width:20%"></div></div></button>
          <button class="gm-add-area-card"><span>＋</span><span>Add area</span></button>
        </section>
        <div class="gm-section-title"><h2>Focus</h2></div>
        <section class="gm-focus-list">
          <button class="gm-focus-row"><div><strong>Optionality</strong><span>Work → Dry Bulk → Trading</span></div><b>60%</b></button>
          <button class="gm-focus-row"><div><strong>Speaking</strong><span>English</span></div><b>40%</b></button>
        </section>
        <section class="gm-signal-grid"><button class="gm-signal-card"><span>To Verify</span><strong>3 Hypotheses</strong></button><button class="gm-signal-card"><span>Open Questions</span><strong>5 Questions</strong></button></section>
        <div class="gm-section-title"><h2>Recent</h2></div>
        <section class="gm-content-list"><button class="gm-content-card"><div class="gm-content-card-top"><span class="gm-type">CASE</span><span class="gm-muted">2d ago</span></div><strong>Higher Voyage TCE isn't always better</strong><span class="gm-content-path">Trading · Optionality</span></button></section>
      </div>
      <button class="gm-fab" aria-label="Quick Capture">＋</button>
      <nav class="gm-nav"><button class="gm-nav-item is-active"><span>⌂</span><span>Home</span></button><button class="gm-nav-item"><span>☷</span><span>Map</span></button><button class="gm-nav-item"><span>▤</span><span>Library</span></button><button class="gm-nav-item"><span>✦</span><span>AI</span></button></nav>
    </div>
  </main>
  <template id="map-view">
    <header class="gm-page-header"><div class="gm-header-leading"><div><p class="gm-eyebrow">MY GROWTH</p><h1>Capability Map</h1></div></div><button class="gm-icon-button" aria-label="Add root area">＋</button></header>
    <div class="gm-map-summary"><span>My Growth</span><strong>38%</strong></div>
    <div class="gm-tree">
      <div class="gm-tree-row" style="--gm-depth:0"><button class="gm-tree-toggle">⌄</button><button class="gm-tree-main"><span>Work</span><strong>48%</strong></button><button class="gm-tree-more">•••</button></div>
      <div class="gm-tree-row" style="--gm-depth:1"><button class="gm-tree-toggle">⌄</button><button class="gm-tree-main"><span>Dry Bulk Commercial</span><strong>52%</strong></button><button class="gm-tree-more">•••</button></div>
      <div class="gm-tree-row" style="--gm-depth:2"><button class="gm-tree-toggle">›</button><button class="gm-tree-main"><span>Operation</span><strong>66%</strong></button><button class="gm-tree-more">•••</button></div>
      <div class="gm-tree-row" style="--gm-depth:2"><button class="gm-tree-toggle">⌄</button><button class="gm-tree-main"><span>Trading</span><strong>47%</strong></button><button class="gm-tree-more">•••</button></div>
      <div class="gm-tree-row" style="--gm-depth:3"><button class="gm-tree-toggle">·</button><button class="gm-tree-main"><span>Cargo</span><strong>60%</strong></button><button class="gm-tree-more">•••</button></div>
      <div class="gm-tree-row" style="--gm-depth:3"><button class="gm-tree-toggle">·</button><button class="gm-tree-main"><span>Tonnage</span><strong>55%</strong></button><button class="gm-tree-more">•••</button></div>
      <div class="gm-tree-row" style="--gm-depth:3"><button class="gm-tree-toggle">·</button><button class="gm-tree-main"><span>Positioning</span><strong>40%</strong></button><button class="gm-tree-more">•••</button></div>
      <div class="gm-tree-row" style="--gm-depth:3"><button class="gm-tree-toggle">·</button><button class="gm-tree-main"><span>Optionality</span><strong>60%</strong></button><button class="gm-tree-more">•••</button></div>
      <div class="gm-tree-row" style="--gm-depth:2"><button class="gm-tree-toggle">›</button><button class="gm-tree-main"><span>FFA</span><strong>31%</strong></button><button class="gm-tree-more">•••</button></div>
      <div class="gm-tree-row" style="--gm-depth:0"><button class="gm-tree-toggle">›</button><button class="gm-tree-main"><span>Fitness</span><strong>35%</strong></button><button class="gm-tree-more">•••</button></div>
      <div class="gm-tree-row" style="--gm-depth:0"><button class="gm-tree-toggle">›</button><button class="gm-tree-main"><span>English</span><strong>28%</strong></button><button class="gm-tree-more">•••</button></div>
    </div><button class="gm-inline-add">+ &nbsp;Add Area</button>
  </template>
  <template id="library-view">
    <header class="gm-page-header"><div class="gm-header-leading"><div><p class="gm-eyebrow">YOUR KNOWLEDGE</p><h1>Library</h1></div></div><button class="gm-icon-button" aria-label="Add content">＋</button></header>
    <button class="gm-inbox-banner"><span>▣</span><div><strong>3 in Inbox</strong><span>Review and organize your captures</span></div><span>›</span></button>
    <div class="gm-search"><span>⌕</span><input class="gm-search-input" placeholder="Search my knowledge…"></div>
    <div class="gm-chips"><button class="gm-chip is-active">All</button><button class="gm-chip">Knowledge</button><button class="gm-chip">Case</button><button class="gm-chip">Lesson</button><button class="gm-chip">Hypothesis</button><button class="gm-chip">Question</button></div>
    <details class="gm-filters"><summary>Filters</summary></details><div class="gm-result-count">4 items</div>
    <div class="gm-content-list">
      <button class="gm-content-card"><div class="gm-content-card-top"><span class="gm-type">CASE</span><span class="gm-muted">2d ago</span></div><strong>Higher Voyage TCE isn't always better</strong><span class="gm-content-path">Trading · Optionality</span></button>
      <button class="gm-content-card"><div class="gm-content-card-top"><span class="gm-type">LESSON</span><span class="gm-muted">4d ago</span></div><strong>Clarify your bottom line before negotiating</strong><span class="gm-content-path">Communication · Negotiation</span></button>
      <button class="gm-content-card"><div class="gm-content-card-top"><span class="gm-type">HYPOTHESIS</span><span class="gm-muted">1w ago</span></div><strong>Optionality matters more when uncertainty is asymmetric</strong><span class="gm-content-path">Trading</span></button>
    </div>
  </template>
  <template id="detail-view">
    <header class="gm-page-header"><div class="gm-header-leading"><button class="gm-icon-button">‹</button><div><p class="gm-eyebrow">CAPABILITY</p><h1>Optionality</h1></div></div><button class="gm-icon-button">•••</button></header>
    <div class="gm-breadcrumb"><button>Work</button><span>/</span><button>Dry Bulk</button><span>/</span><button>Trading</button><span>/</span><button>Optionality</button></div>
    <section class="gm-capability-hero"><strong class="gm-progress-number">60%</strong><div class="gm-progress-track"><div class="gm-progress-fill" style="width:60%"></div></div><div class="gm-stage-row"><div><span class="gm-muted">Stage</span><b>Practiced / has cases</b></div><button class="gm-text-button">Change</button></div><button class="gm-primary-button">Set as Focus</button></section>
    <div class="gm-section-title"><h2>Sub-capabilities</h2></div><div class="gm-subcap-list"><button class="gm-subcap-row"><span>Next Employment</span><b>60%</b><span>›</span></button><button class="gm-subcap-row"><span>Redelivery Position</span><b>80%</b><span>›</span></button></div>
    <div class="gm-section-title"><h2>Library</h2></div><div class="gm-stat-grid"><button class="gm-stat-card"><strong>4</strong><span>Knowledge</span></button><button class="gm-stat-card"><strong>7</strong><span>Case</span></button><button class="gm-stat-card"><strong>3</strong><span>Lesson</span></button><button class="gm-stat-card"><strong>2</strong><span>Hypothesis</span></button><button class="gm-stat-card"><strong>3</strong><span>Question</span></button></div>
  </template>
  <template id="archive-view">
    <header class="gm-page-header"><div class="gm-header-leading"><button class="gm-icon-button">‹</button><div><p class="gm-eyebrow">RECOVERABLE</p><h1>Archive</h1></div></div></header>
    <div class="gm-inline-actions"><button>View Checkpoints</button><button>Restore Last</button></div><div class="gm-section-title"><h2>Capabilities</h2></div>
    <div class="gm-archive-row"><div><strong>Old Career Path</strong><span>CAP-ABCDEFGH</span></div><button>Restore</button></div><div class="gm-archive-row"><div><strong>Legacy Framework</strong><span>CAP-HGFEDCBA</span></div><button>Restore</button></div>
    <div class="gm-section-title"><h2>Content</h2></div><div class="gm-archive-row"><div><strong>Outdated working assumption</strong><span>Hypothesis · HYP-12345678</span></div><button>Restore</button></div>
  </template>
  <template id="ai-view">
    <header class="gm-page-header"><div class="gm-header-leading"><div><p class="gm-eyebrow">OPTIONAL</p><h1>AI Assistant</h1></div></div></header>
    <section class="gm-ai-status"><div class="gm-ai-icon">✦</div><h2>AI is not configured.</h2><p>Growth Map works fully without AI.</p></section><div class="gm-future-list"><div class="gm-future-card"><strong>Organize with AI</strong><p>Preview suggested type, capabilities, confidence, status, and structure before adding anything.</p><span>Coming later</span></div><div class="gm-future-card"><strong>Ask My Knowledge</strong><p>Search locally first, send only selected context, and show every source used.</p><span>Coming later</span></div></div><p class="gm-privacy-note">V1 makes no network requests and stores no API keys.</p>
  </template>
  <template id="capture-view">
    <div style="height:100%;display:flex;align-items:center;justify-content:center;padding:12px;background:rgba(0,0,0,.25)"><section class="gm-modal gm-capture-modal" style="background:var(--background-primary);padding:20px"><div class="modal-content"><h2>Record something</h2><div class="gm-context-pill">Linked to Optionality</div><textarea class="gm-capture-input" placeholder="What's worth remembering?" rows="8"></textarea><details class="gm-optional-title"><summary>Add a title (optional)</summary><input class="gm-text-input" placeholder="Title"></details><div class="gm-modal-actions"><button>Cancel</button><button class="gm-primary-button">Save to Inbox</button></div></div></section></div>
  </template>
  <script>
    const mode = new URLSearchParams(location.search).get("view");
    if (mode === "capture") {
      document.querySelector(".gm-shell").replaceChildren(document.querySelector("#capture-view").content.cloneNode(true));
    } else if (mode) {
      const template = document.querySelector(`#${mode}-view`);
      if (template) document.querySelector(".gm-scroll").replaceChildren(template.content.cloneNode(true));
    }
  </script>
</body>
</html>
